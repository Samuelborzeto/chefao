const POL=[null,['Guarda amigo','👮',300,20,'Cafezinho 30% mais barato e +10 pontos de chance.'],['Sargento','🎖️',1500,80,'Pena de cadeia 20% menor.'],['Delegado','🕴️',8000,250,'25% de chance de sair da cadeia em 5 minutos.'],['Comandante','⭐',40000,700,'De vez em quando avisa da batida e baixa o calor sozinho.']];
const influencia=()=>state.emp.length*10+state.renda.reduce((a,n,i)=>a+(RENDA[i][2]>=150000?n*15:0),0)+(state.lar==2?30:0);
const advPrice=()=>Math.max(3000,Math.round(2.2*(state.lastAvg||30)));

 if(state.adv>0&&state.jail-state.t>=15*60000){state.adv=0;state.jail=0;say('⚖️ O advogado apareceu e soltou você na hora.')}
}

const wtxt=(l,ok)=>{const a=ARMAS[l.w==null?0:l.w];return `${a[1]} ${(ok?WOK:WKO)[l.w]||(ok?WFX.ok:WFX.ko)[a[5]]} `};
const animT=()=>ANIM.find(a=>(state.anim||0)<a[0]);
const animBon=()=>{const a=state.anim||0;return a>=60?'+8 pontos de chance no próximo roubo':a>=30?'+4 pontos de chance no próximo roubo':'sem bônus de chance ainda'};
const baileNome=()=>BAILES[(Math.floor(state.t/DAY)+state.baN)%BAILES.length];
function endBaile(fim){
 if(!state.inBaile)return;
 const an=state.anim||0,rp=Math.floor(an/25),pm=an>=60?.08:an>=30?.04:0;
 state.inBaile=false;state.ev=null;
 state.rep+=rp;rsAdd('bai',rp);const up=gainXp('c',an/10);if(an>=60)state.heat=Math.max(0,state.heat-5);
 state.moral=pm;state.moralUntil=state.t+3*HOUR;
 say(`🪩 ${fim?'O baile acabou':'Você saiu do baile'}: animação ${Math.floor(an)}%, +${rp} de respeito${up?', +1 de carisma':''}${pm?` e +${Math.round(pm*100)} pontos de chance por 3 horas`:''}.`);
}
const need=a=>Math.round(4+(a-5)*1.2);
const xpOf=r=>Math.max(1,Math.round(Math.sqrt(r.rp)));
function gainXp(k,x){
 state.ax=state.ax||{f:0,i:0,c:0,t:0};
 state.ax[k]=(state.ax[k]||0)+x;let up=0;
 while(state.ax[k]>=need(state.a[k])){state.ax[k]-=need(state.a[k]);state.a[k]++;up++}
 return up;
}
function attrNow(k){
 const a=state.a;
 if(k=='f')return `poder ${a.f*4} nos roubos violentos`;
 if(k=='i')return `poder ${a.i*4} nos golpes espertos`;
 if(k=='c')return `poder ${a.c*4} na lábia, ${Math.round(Math.min(.8,Math.max(.2,.35+(a.c-5)*.02))*100)}% de chance na paquera, +${Math.max(0,a.c-5)} pontos no suborno`;
 return `ressaca ganha −${Math.round(Math.min(.5,Math.max(0,(a.t-5)*.02))*100)}%, +${Math.max(0,(a.t-5)*2)} de estamina máxima`;
}
const despPer=()=>Math.max(3,Math.round((state.lastAvg||30)*.04));
const despCost=()=>Math.round(Math.min(25,state.heat)*despPer());
const bonusPr=i=>Math.min(.2,((state.pr&&state.pr[i])||0)*.01);
const bonusResp=()=>Math.min(.1,Math.floor(resp()/15)*.01);
function jailPrev(r){const T=tier(state.tm);return {len:Math.max(5*60000,Math.round(r.pena*60000*band()[3]*(1+.1*T)*penaDesc(r)*penaMult())),lost:state.arma==24?0:Math.floor(state.cash*.2)}}
function chanceOf(r){
 const i=ROUBOS.indexOf(r),ratio=pwOf(r)/Math.max(r.pw,10);
 let c=ratio>=1?.7+.28*Math.min(1,ratio-1):.7*ratio*ratio;
 c+=bonusPr(i)+bonusResp();
 if(state.p=='golpista')c+=.15;if(state.p=='bicheiro')c-=.1;if(r.tp=='v')c+=state.arma==6?.05:state.arma==26?.08:0;c+=state.cch||0;c+=ES().ch;c+=state.t<(state.moralUntil||0)?(state.moral||0):0;
 c-=band()[2];if(state.dica)c+=.15;c-=Math.min(.08,(state.ficha||0)*.015);if(state.ress>=80)c-=.1;else if(state.ress>=50)c-=.03;
 return Math.min(.98,Math.max(.05,c));
}
function rewardMult(r){const ratio=pwOf(r)/Math.max(r.pw,10);return ratio<=2?1:Math.max(.5,2/ratio)}
function pendente(){const days=Math.min(state.t-state.lastCol,2*DAY)/DAY;let s=0;RENDA.forEach((it,i)=>{s+=it[3]*state.renda[i]});return s*days*incMult()}
function trackPos(){
 if(resp()<=0)return;
 const l=rankList(),pos=l.findIndex(x=>x.me)+1;
 if(state.lastPos&&pos<state.lastPos){const passed=l.slice(pos,state.lastPos).map(x=>x.n);state.pass=state.pass||[];state.pass.push({t:state.t,pos,n:passed.join(', ')});if(state.pass.length>30)state.pass.shift()}
 state.lastPos=pos;if(pos<(state.bestPos||99)){state.bestPos=pos;state.bestT=state.t}
}
function rankList(){
 const l=NPCS.map(n=>({n:n[0],r:Math.floor(n[1]*state.t/ROUND)}));
 l.push({n:'Você',r:resp(),me:true});
 l.sort((a,b)=>b.r-a.r);return l;
}
function metaLine(){
 const l=rankList(),i=l.findIndex(x=>x.me);
 if(i==0)return '🏆 Você está em 1º lugar no ranking.';
 const n=l[i-1];return `🏆 Faltam ${num(n.r-resp()+1)} de respeito para passar ${n.n} e subir para ${i}º.`;

function jailInfo(){
 const r=ROUBOS[state.jailR]||ROUBOS[0],rem=Math.max(0,state.jail-state.t),frac=state.jailLen?rem/state.jailLen:1,M=tier(state.ml);
 const base=(r.g[0]+r.g[1])/2*.18;
 const sub=Math.max(5,Math.round(base*frac*(1-.08*M)*(state.pol>=1?.7:1))),fia=Math.max(15,Math.round(sub*3));
 let ch=.8+(state.a.c-5)*.01+.03*M+(state.arma==2?.1:0)+(state.pol>=1?.1:0);ch-=state.jailR>=9?.1:state.jailR>=6?.05:0;
 return {r,rem,sub,fia,ch:Math.min(.95,Math.max(.5,ch))};
}

// ---- tempo
function sync(){const now=Date.now();advance((now-state.lastTs)*state.speed);state.lastTs=now}
function advance(dt){
 while(dt>0&&!state.over){
  const h=Math.min(dt,HOUR/2,ROUND-state.t);dt-=h;
  if(h<=0){state.over=true;break}
  step(h);
  if(state.t>=ROUND-1){state.over=true;state.t=ROUND}
 }
 if(state.over)endRound();
}
function step(h){
 const f=h/HOUR;const wasJail=state.t<state.jail;state.t+=h;
 if(wasJail&&gainXp('f',1.5*f))say('🏋️ Academia da cadeia: +1 Força');
 if(state.hide){const t0=state.t-h,ov=Math.max(0,Math.min(state.t,state.hide.end)-t0);state.heat=Math.max(0,state.heat-state.hide.drop*ov/state.hide.dur);if(state.hide.hosp)state.ress=Math.max(0,state.ress-45*ov/state.hide.dur);if(state.t>=state.hide.end){say(state.hide.hosp?'🏥 Você teve alta. A ressaca baixou.':'🏠 Você saiu do esconderijo. O calor baixou.');state.hide=null}}
 const mx=maxSt();
 const rg=10*CASAS[state.casa][3]*f*(state.inBaile?2:1)*(state.ress>=50?.6:1);
 if(state.st>=mx)state.sw=(state.sw||0)+rg;
 if(state.st<mx){const ns=Math.min(mx,state.st+rg);state.sw=(state.sw||0)+Math.max(0,state.st+rg-mx);if(state.inBaile&&state.bg)state.bg.st+=ns-state.st;state.st=ns}
 state.tk=Math.min(40,state.tk+4/24*f);
 trackPos();
 state.ress=Math.max(0,state.ress-.5*f);state.ficha=Math.max(0,(state.ficha||0)-.5/24*f*(state.pol>=2?2:1));
 state.heat=Math.max(0,state.heat-3*f*(state.inBaile?2:1));
 if(state.bank>0)state.bank+=Math.min(state.bank,100000)*.02/24*f;
 state.emp.forEach(i=>{
  const cost=EMP[i][3]/24*f,prod=EMP[i][4]*(state.p=='empresario'?1.3:1)/24*f;
  if(state.debt>0)state.debt+=cost;
  else if(state.cash>=cost){state.cash-=cost;state.cash+=prod}
  else state.debt+=cost;
 });
 if(state.inBaile){
  if(state.t>=state.baileEnd)endBaile(true);
  else{state.anim=Math.min(100,(state.anim||0)+6*f);if(!state.ev&&Math.random()<.5*f)state.ev={k:pick(BAILEV)}}
 }
 if(!state.inBaile&&!state.rev&&state.t>=state.jail&&Math.random()<.06*f*(1+state.heat/40))state.rev={k:pick(RNDEV.filter(k=>state.heat>=(EVX[k].mh||0))),until:state.t+4*HOUR};
 if(state.rev&&state.t>state.rev.until)state.rev=null;
 if(state.lar>=0){
  const L=LAR[state.lar];
  state.cash+=L[2]/24*f;state.heat=Math.min(100,state.heat+L[3]*f);
  if(state.t>=state.larEnd){
   const rp=2+Math.floor(L[6]/5);state.cash+=L[2];state.rep+=rp;state.larDone=(state.larDone||0)+1;state.lar=-1;
   say(`🍊 Contrato cumprido! Bônus de ${fmt(L[2])} e +${rp} de respeito.`);
  }else if(state.t>=state.jail&&Math.random()<L[4]*(1-.15*Math.min(2,state.larDone||0))*f/24){
   const len=Math.round(L[5]*60000*(1-.1*meta.up.pol)*(state.cpena||1)),left=Math.round((state.larAdv||0)*Math.max(0,state.larEnd-state.t)/(3*DAY));
   state.cash=Math.max(0,state.cash-left);
   state.lar=-1;state.jail=state.t+len;state.jailLen=len;state.nj=(state.nj||0)+1;state.tj=(state.tj||0)+len;meta.cn.pr++;state.jailR=L[7];state.jailWhy='Esquema de laranja que caiu';state.ficha=Math.min(10,(state.ficha||0)+1);state.lastArrest=state.t;
   state.inBaile=false;state.ev=null;state.rev=null;state.hide=null;state.heat=Math.min(100,state.heat+10);state.last=null;
   say('🍊 O esquema caiu e o nome no papel era o seu. Preso por '+mins(len)+'.'+(left?' Você perdeu '+fmt(left)+' do adiantamento.':''));afterJail();
  }
 }
 if(state.pol>0){
  const P=POL[state.pol],c=P[2]/24*f;
  if(state.cash>=c){state.cash-=c;state.polAtraso=0}
  else{state.polAtraso=(state.polAtraso||0)+f;if(state.polAtraso>=12){state.pol--;state.polAtraso=0;state.heat=Math.min(100,state.heat+15);say('🚔 A mesada atrasou e o contato te entregou. Você perdeu um nível e o calor subiu.')}}
  if(state.pol>=4&&state.heat>=20&&Math.random()<.04*f){state.heat=Math.max(0,state.heat-15);say('🚔 O comandante avisou da batida. −15 de calor.')}
 }
}

 if(busy())return;
 const el=state.t-state.lastCol,days=Math.min(el,2*DAY)/DAY,fast=el<6*HOUR;
 let gain=0,lost=0;
 RENDA.forEach((it,i)=>{
  const n=state.renda[i];
  for(let k=0;k<n;k++){
   const risk=it[4]*riskMult()*(fast?2:1);
   if(Math.random()<risk){state.renda[i]--;lost++}else gain+=it[3]*days*incMult();
  }
 });
 if(bk===1)state.bank+=gain;else state.cash+=gain;state.lastCol=state.t;state.recN=(state.recN||0)+1;
 say(`💰 Recolheu ${fmt(gain)}${bk===1?' (guardado no banco)':''}${lost?` e perdeu ${lost} ${lost>1?'itens':'item'}`:''}.`);
});

// blackjack
const draw=()=>ri(1,13);
const hv=h=>{let s=0,a=0;h.forEach(r=>{s+=Math.min(10,r);if(r==1)a++});return a&&s+10<=21?s+10:s};
const cn=r=>r==1?'A':r>10?'JQK'[r-11]:r;
function bjAdv(){
 const b=state.bj;
 while(b.cur<b.hands.length&&(b.hands[b.cur].done||hv(b.hands[b.cur].p)>=21)){b.hands[b.cur].done=true;b.cur++}
 if(b.cur>=b.hands.length)bjSettle();
}
function bjSettle(){
 const b=state.bj;
 if(!b.nat&&b.hands.some(h=>hv(h.p)<=21))while(hv(b.d)<17)b.d.push(draw());
 const d=hv(b.d);let ret=0,bet=0;const ms=[];
 b.hands.forEach((h,i)=>{
  const p=hv(h.p),pre=b.hands.length>1?`Mão ${i+1}: `:'';let r=0,m;
  if(p>21)m=`Você estourou com ${p}. Perdeu ${fmt(h.b)}.`;
  else if(b.nat){if(d==21){r=h.b;m='Blackjack dos dois. Empate, a mesa devolveu o valor.'}else{r=h.b*2.5;m=`Blackjack! Ganhou ${fmt(h.b*1.5)}.`}}
  else if(d>21){r=h.b*2;m=`A banca estourou com ${d}. Você fez ${p} e ganhou ${fmt(h.b)}.`}
  else if(p>d){r=h.b*2;m=`Você fez ${p}, a banca fez ${d}. Ganhou ${fmt(h.b)}.`}
  else if(p==d){r=h.b;m=`Os dois fizeram ${p}. Empate, a mesa devolveu o valor.`}
  else m=`Você fez ${p}, a banca fez ${d}. Perdeu ${fmt(h.b)}.`;
  ret+=r;bet+=h.b;ms.push(pre+m);
 });
 b.over=true;b.msg=ms.join('<br>');
 const net=ret-bet;state.cassLucro=(state.cassLucro||0)+net;
 if(net>(state.bjBest||0)){state.bjBest=net;b.msg+=' 🏆 Novo recorde de ganho!'}
 state.cash+=ret;say('🃏 '+ms.join(' '));
}
G.bjDeal=A(()=>{
 if(inJail())return;
 const b=readNum('bj'),m=MESAS[state.mesa||0];
 if(resp()<m[4])return say('Mesa trancada.');
 if(b<=0||b>state.cash)return say('Valor inválido para a mesa.');
 if(b<m[2])return say('Aposta mínima desta mesa: '+fmt(m[2]));
 if(m[3]&&b>m[3]){const si=MESAS.findIndex((x,j)=>j>(state.mesa||0)&&resp()>=x[4]&&b>=x[2]&&(!x[3]||b<=x[3]));state.sug=si>=0?{i:si,b}:null;return say(`Esta mesa aceita até ${fmt(m[3])}.`+(si>=0?` Toque em "Ir para ${MESAS[si][0]}" para apostar ${fmt(b)}.`:' Suba de nível para liberar uma mesa maior.'))}
 state.sug=null;state.lastBet=b;state.cash-=b;
 state.bj={hands:[{p:[draw(),draw()],b,done:false}],cur:0,d:[draw(),draw()],over:false,msg:'',nat:false,split:false};
 if(hv(state.bj.hands[0].p)==21){state.bj.nat=true;state.bj.hands[0].done=true;bjAdv()}
});

// Leãozinho da Sorte
G.spin=A(()=>{
 if(inJail())return;
 const b=readNum('sl');
 if(b<=0||b>state.cash)return say('Valor inválido para o giro.');
 state.lastBet=b;state.cash-=b;state.spins++;
 let m;
 if(state.spins<=5)m=Math.random()<.5?2:0;
 else{const r=Math.random();m=r<.005?50:r<.03?10:r<.11?3:r<.26?1:0}
 let r;
 if(m==50)r=['🦁','🦁','🦁'];
 else if(m==10){const s=pick(['💰','🍒','⭐']);r=[s,s,s]}
 else if(m==3)r=['🦁','🦁',pick(SYM.filter(x=>x!='🦁'))];
 else if(m==2||m==1){const s=pick(['🍒','🍋','⭐']);r=[s,s,pick(SYM.filter(x=>x!=s&&x!='🦁'))]}
 else{do{r=[pick(SYM),pick(SYM),pick(SYM)]}while(r[0]==r[1]&&r[1]==r[2]||r.filter(x=>x=='🦁').length>=2)}
 const ret=b*m;state.cash+=ret;state.cassLucro=(state.cassLucro||0)+ret-b;
 const msg=m==0?'O leão comeu o valor do giro.':m==1?'Empatou, só devolveu o valor.':`Pagou ×${m}: +${fmt(ret-b)}`;
 state.slot={r,msg};say('🦁 '+msg);
});

function tick(){

 if(state.cartas&&!state.cartaOk)return;
 sync();chkMis();chkAch();save();
 const eb=evBanner(),ebe=$('evb');if(ebe&&ebe.dataset.h!==eb){ebe.dataset.h=eb;ebe.innerHTML=eb}

 nTick++;

 if(nTick%8==0&&!(document.activeElement&&document.activeElement.tagName=='INPUT')){const b=$('body'),sy=window.scrollY||0;if(b){b.innerHTML=view();window.scrollTo(0,sy)}}
 if(state.over)render();
}
load();
render();
setInterval(tick,1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
